name: Sync upstream

on:
  workflow_dispatch:
  schedule:
    - cron: '43 * * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: master

      - name: Create or update upstream sync pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote add upstream https://github.com/GTNewHorizons/DreamAssemblerXXL.git
          git fetch upstream master

          if git merge-base --is-ancestor upstream/master master; then
            exit 0
          fi

          pr_number=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?base=master&head=GTNewHorizons:master&state=open" --jq '.[0].number')
          if [ -z "$pr_number" ]; then
            pr_number=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/pulls" \
              -f base=master \
              -f head=GTNewHorizons:master \
              -f title="Sync upstream master" \
              -f body="Syncs this fork with the latest GTNewHorizons/DreamAssemblerXXL master." \
              --jq .number)
          fi

          if ! gh pr merge "$pr_number" --auto --merge; then
            mergeable=$(gh pr view "$pr_number" --json mergeable --jq '.mergeable')
            if [ "$mergeable" != "CONFLICTING" ]; then
              exit 1
            fi
          fi
