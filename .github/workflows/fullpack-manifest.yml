name: Full-pack manifest

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: 3.11
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Get cache date
        id: date
        run: echo "cachedate=$(date '+%G-w%V')" >> "$GITHUB_OUTPUT"

      - name: Load cached config
        id: load-config-cache
        uses: actions/cache/restore@v5
        with:
          path: cache
          key: fullpack-config-${{ runner.os }}-${{ steps.date.outputs.cachedate }}
          restore-keys: |
            fullpack-config-${{ runner.os }}-

      - name: Generate manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python -m daxxl.cli.generate_fullpack_manifest

      - name: Save cached config
        if: steps.load-config-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: cache
          key: fullpack-config-${{ runner.os }}-${{ steps.date.outputs.cachedate }}

      - name: Mirror translations and publish manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python -m daxxl.cli.publish_fullpack_manifest releases/manifests/fullpack/daily.json
